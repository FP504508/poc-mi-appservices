name: Build and Push Docker Images to ACR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'frontend-vue/**'

jobs:
  build-backend:
    name: Build & Push — Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login al Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push imagen backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.REGISTRY_LOGIN_SERVER }}/poc-mi-backend:latest

      - name: Imagen publicada
        run: |
          echo "✅ Backend publicado:"
          echo "   ${{ secrets.REGISTRY_LOGIN_SERVER }}/poc-mi-backend:latest"

  build-frontend:
    name: Build & Push — Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login al Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push imagen frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.REGISTRY_LOGIN_SERVER }}/poc-mi-frontend:latest

      - name: Imagen publicada
        run: |
          echo "✅ Frontend publicado:"
          echo "   ${{ secrets.REGISTRY_LOGIN_SERVER }}/poc-mi-frontend:latest"

  build-frontend-vue:
    name: Build & Push — Frontend Vue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login al Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push imagen frontend Vue
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-vue
          push: true
          tags: ${{ secrets.REGISTRY_LOGIN_SERVER }}/poc-mi-frontend-vue:latest

      - name: Imagen publicada
        run: |
          echo "✅ Frontend Vue publicado:"
          echo "   ${{ secrets.REGISTRY_LOGIN_SERVER }}/poc-mi-frontend-vue:latest"

  summary:
    name: Resumen
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-frontend-vue]
    steps:
      - name: Imágenes publicadas correctamente
        run: |
          echo ""
          echo "🎉 Todas las imágenes publicadas en el ACR"
          echo ""
          echo "  Backend      → ${{ secrets.REGISTRY_LOGIN_SERVER }}/poc-mi-backend:latest"
          echo "  Frontend     → ${{ secrets.REGISTRY_LOGIN_SERVER }}/poc-mi-frontend:latest"
          echo "  Frontend Vue → ${{ secrets.REGISTRY_LOGIN_SERVER }}/poc-mi-frontend-vue:latest"
          echo ""
          echo "Siguiente paso: ejecutar bash deploy.sh para crear la infraestructura Azure."
          echo ""
